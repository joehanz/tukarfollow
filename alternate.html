<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="screen-orientation" content="any" />
  <meta name="fullscreen" content="yes" />
  <title>TUKARFOLLOW — Pemutar AbyssPlayer</title>
  <meta name="description" content="Nonton film dengan pemutar AbyssPlayer." />
  <meta name="robots" content="index, follow" />
  <meta name="language" content="id" />
  <link rel="icon" href="https://tukarfollow.web.id/banner/tukarfollow.icon.webp" type="image/x-icon" />
  <link rel="apple-touch-icon" href="https://tukarfollow.web.id/banner/tukarfollow.icon.webp" />
  <meta property="og:type" content="video.movie" />
  <meta property="og:title" content="TUKARFOLLOW — AbyssPlayer" />
  <meta property="og:url" content="https://tukarfollow.web.id/alternate.html" />
  <meta property="og:image" content="https://tukarfollow.web.id/banner/banner-tukarfollow.webp" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    html, body {
      background-color: #0a0a0a;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    .video-main-wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
    }
    #filmIframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000;
    }
    .watermark-logo {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      right: max(16px, env(safe-area-inset-right));
      z-index: 99999;
      opacity: 0.6;
      pointer-events: none;
    }
    .watermark-logo img { width: 72px; height: auto; }
    .subtitle-layer {
      position: fixed;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      z-index: 99999;
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .subtitle-layer.auto-hide { opacity: 0; pointer-events: none; }
    .subtitle-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(20,20,20,0.75);
      pointer-events: auto;
    }
    .ctrl-btn {
      background: rgba(255,255,255,0.18);
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.3); }
    .ctrl-btn svg { width: 18px; height: 18px; }
    .msg-box {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #ccc;
      padding: 24px;
    }
    :fullscreen, :-webkit-full-screen, :-moz-full-screen, :-ms-fullscreen {
      width: 100vw !important; height: 100vh !important;
    }
    :fullscreen .watermark-logo, :fullscreen .subtitle-layer,
    :-webkit-full-screen .watermark-logo, :-webkit-full-screen .subtitle-layer {
      position: fixed !important; opacity: 1 !important; z-index: 99999 !important;
    }
    @media (max-width: 768px) {
      .ctrl-btn { width: 38px; height: 38px; }
      .watermark-logo img { width: 56px; }
    }
  </style>
</head>
<body>

  <div class="video-main-wrapper" id="videoWrapper">
    <iframe id="filmIframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    <div class="msg-box" id="msgBox" style="display:none;">ID Film tidak ditemukan atau tautan tidak tersedia</div>
  </div>

  <div class="watermark-logo">
    <img src="https://tukarfollow.web.id/banner/tukarfollow.icon.webp" alt="TukarFollow" loading="lazy" />
  </div>

  <div class="subtitle-layer" id="subLayer">
    <div class="subtitle-controls">
      <button class="ctrl-btn" id="btnBack" title="Kembali">
        <i data-lucide="arrow-left"></i>
      </button>
      <button class="ctrl-btn" id="btnFullscreen" title="Layar Penuh">
        <i data-lucide="maximize"></i>
      </button>
    </div>
  </div>

<script>
const JSON_PATHS = [
  'https://midasxxi.github.io/tukarfollow/movies.json',
  'https://midasxxi.github.io/tukarfollow/movies2025.json',
  'https://midasxxi.github.io/tukarfollow/movies2024.json',
  'https://midasxxi.github.io/tukarfollow/moviesclassic.json'
];
const filmIframe = document.getElementById('filmIframe');
const msgBox = document.getElementById('msgBox');
const btnBack = document.getElementById('btnBack');
const btnFullscreen = document.getElementById('btnFullscreen');
const subLayer = document.getElementById('subLayer');

// ✅ SAMA PERSIS DENGAN watch.html — Ambil ID dan bersihkan dari huruf
function ambilIdDariUrl() {
  const query = window.location.search;
  if (!query) return null;
  const bagian = query.replace('?id=', '').split('/')[0];
  const idBersih = bagian.replace(/\D/g, ''); // Hapus semua selain angka
  return idBersih || null;
}

// ✅ Muat film → ambil kolom iframe saja
async function muatFilm(tmdbId) {
  if (!tmdbId) return tampilPesan();
  
  console.log('🔍 Mencari ID:', tmdbId); // Bisa dicek di konsol browser

  for (const path of JSON_PATHS) {
    try {
      const res = await fetch(path, { cache: 'no-store' });
      if (!res.ok) continue;
      const daftar = await res.json();
      const film = daftar.find(f => Number(f.tmdb_id) === Number(tmdbId));
      if (!film) continue;

      console.log('✅ Ditemukan:', film); // Cek konsol untuk lihat isi film
      if (film.iframe) {
        filmIframe.src = film.iframe;
        return;
      }
    } catch (e) { console.warn('⚠️ Gagal baca:', path, e); }
  }
  tampilPesan();
}

function tampilPesan() {
  filmIframe.style.display = 'none';
  msgBox.style.display = 'block';
}

// Tombol Kembali
btnBack.addEventListener('click', () => {
  window.history.length > 1 ? history.back() : location.href = 'index.html';
});

// Tombol Layar Penuh
btnFullscreen.addEventListener('click', async () => {
  if (!document.fullscreenElement) {
    await document.documentElement.requestFullscreen?.();
    screen.orientation?.lock?.('landscape').catch(()=>{});
  } else {
    await document.exitFullscreen?.();
    screen.orientation?.unlock?.();
  }
  updateIcon();
});
function updateIcon() {
  const isFull = !!document.fullscreenElement;
  btnFullscreen.innerHTML = isFull 
    ? '<i data-lucide="minimize"></i>' 
    : '<i data-lucide="maximize"></i>';
  lucide.createIcons();
}
document.addEventListener('fullscreenchange', updateIcon);

// Sembunyikan kontrol otomatis
let hideTimer;
function resetTimer() {
  subLayer.classList.remove('auto-hide');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => subLayer.classList.add('auto-hide'), 3000);
}
['mousemove','touchstart','click','scroll','keydown'].forEach(ev =>
  document.addEventListener(ev, resetTimer, { passive: true })
);

// Jalankan
document.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  const id = ambilIdDariUrl();
  muatFilm(id);
  resetTimer();
});
</script>

</body>
</html>
