      align-items: center;
      justify-content: center;

      transition: background 0.2s;

    .close-comments:hover {

    }
    .comments-section {
      flex: 1;
      padding: 16px;

    }
    .empty-comments {

    }

    }

      height: 100%;
      border: none;
      display: none;

    }

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      cursor: pointer;
      background: rgba(0,0,0,0);
    }

      opacity: 0.6;
      pointer-events: none;
    }
    .watermark-logo img {
      width: 80px;
      height: auto;
    }

      right: 0;
      z-index: 999997;
      padding: 0 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: scale(1.05);
    }
    .ctrl-btn svg,
    .ctrl-btn i {
      width: 20px;
      height: 20px;
    }

      left: 0;
      right: 0;
      bottom: 0;
      height: 320px;
      transform: translateY(calc(100% - 42px));
      transition: transform 0.32s ease;
      z-index: 99999;
      pointer-events: none;

      pointer-events: auto;
      color: #fff;

      opacity: 0;
      visibility: hidden;

      visibility: visible;

      "https://rewangiklan.my.id/iklan.html?id=IKL000118",
      "https://rewangiklan.my.id/iklan.html?id=IKL000119",
      "https://caturbangunsentosa.blogspot.com",
      "https://ptdwiprima.blogspot.com"
    ];

    document.addEventListener("DOMContentLoaded", () => {
      const iframe = document.getElementById("filmIframe");
      const videoWrapper = document.getElementById("videoWrapper");
      const dummyLayer = document.createElement("div");
      dummyLayer.style.cssText = `
        position:fixed;top:0;left:0;width:100%;height:100%;
        background:url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgAkJiGKw5otYyJgpBBtop9PZXrNpbMHJUvpja586ANY4sU_n6YWV7axeh02uKQtvfBWJlXCUS67JR6xIuvx_o7__3JZMmz9lFrnB78WQkymFMzqPJE4L2x4uPWH2fNsKJsACIdaQTaVTW4DK1QIgmSJqUzg0DkXIux4DANoKd5QGoQxWwyrxEXEJkBC5U/s1500/segera-dimulai.webp') center/cover no-repeat;
        z-index:9999;
      `;
      videoWrapper.appendChild(dummyLayer);
      setTimeout(() => {
        dummyLayer.style.display = "none";
        const overlay = document.createElement("div");
        overlay.style.cssText = `
          position:absolute;top:0;left:0;width:100%;height:100%;
          background:rgba(0,0,0,0);z-index:6;cursor:pointer;
        `;
        videoWrapper.appendChild(overlay);
        overlay.addEventListener("click", () => {
          const randomDomain = DOMAINS[Math.floor(Math.random() * DOMAINS.length)];
          window.open(randomDomain, "_blank");
          overlay.remove();
          iframe.style.display = "block";
        }, { once:true });
      }, 3000);
    });
  </script>
  <script>
    const videoWrapper = document.getElementById('videoWrapper');
    const filmIframe = document.getElementById('filmIframe');
    const btnHomeBack = document.getElementById('btnHomeBack');
    const btnAddComment = document.getElementById('btnAddComment');
    const btnViewComments = document.getElementById('btnViewComments');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const commentsPanel = document.getElementById('commentsPanel');
    const closeCommentsBtn = document.getElementById('closeCommentsBtn');
    const commentListEl = document.getElementById('commentList');
    const infoPanel = document.getElementById('infoPanel');
    const panelBackdrop = document.getElementById('panelBackdrop');
    let currentMovieId = null;

    // ✅ Ambil ID dari URL
    function ambilIdDariUrl() {
      const query = window.location.search;
      if (!query) return null;
      const bagian = query.replace('?id=', '').split('/')[0];
      const idBersih = bagian.replace(/\D/g, '');
      return idBersih || null;
    }

    // ✅ Cek & Muat Film
    async function cekDanMuatFilm(tmdbId) {
      for (const path of JSON_PATHS) {
        try {
          const res = await fetch(path, { cache: "no-store" });
          if (res.ok) {
            const daftar = await res.json();
            const ketemu = daftar.find(f => Number(f.tmdb_id) === Number(tmdbId));
            if (ketemu && ketemu.iframe) {
              filmIframe.src = ketemu.iframe;
              return true;
            }
          }
        } catch (err) {
          console.warn("⚠️ Gagal baca:", path, err);
        }
      }
      if (videoWrapper) {
        videoWrapper.innerHTML += `<div style="padding:50px; text-align:center; color:#fff; position:absolute; top:0; left:0; right:0;">Link video tidak tersedia</div>`;
      }
      return false;
    }

    // ✅ Tombol Fullscreen
    btnFullscreen?.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
        screen.orientation?.lock('landscape').catch(() => {});
      } else {
        document.exitFullscreen?.();
        screen.orientation?.unlock?.();
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
    function updateFullscreenIcon() {
      const isFull = document.fullscreenElement;
      if (btnFullscreen) {
        btnFullscreen.innerHTML = isFull
          ? '<i data-lucide="minimize"></i>'
          : '<i data-lucide="maximize"></i>';
        lucide.createIcons();
      }
    }

    // ✅ Tombol Kembali
    btnHomeBack?.addEventListener('click', () => {
      if (window.history.length > 1) window.history.back();
      else window.location.href = 'index.html';
    });

    // ✅ Buka/Tutup Form Komentar
    btnAddComment?.addEventListener('click', bukaFormKomen);
    panelBackdrop?.addEventListener('click', tutupFormKomen);
    function bukaFormKomen() {
      infoPanel?.classList.add('show');
      panelBackdrop?.classList.add('active');
    }
    function tutupFormKomen() {
      infoPanel?.classList.remove('show');
      panelBackdrop?.classList.remove('active');
    }

    // ✅ Kirim Komentar
    async function kirimKomentar() {
      const nama = document.getElementById('commentName')?.value.trim();
      const teks = document.getElementById('commentText')?.value.trim();
      if (!nama || !teks) return alert("Isi nama dan komentar dulu!");
      try {
        await fetch(URL_APPS_SCRIPT, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ tmdbId: currentMovieId, nama, komentar: teks })
        });
        alert("✅ Komentar berhasil dikirim!");
        tutupFormKomen();
        setTimeout(muatKomentar, 800);
      } catch {
        alert("❌ Gagal mengirim komentar. Coba lagi.");
      }
    }

    // ✅ Buka/Tutup Daftar Komentar
    btnViewComments?.addEventListener('click', () => {
      const buka = commentsPanel?.classList.toggle('open');
      if (buka) muatKomentar();
    });
    closeCommentsBtn?.addEventListener('click', () => commentsPanel?.classList.remove('open'));

    // ✅ Muat Komentar
    async function muatKomentar() {
      if (!currentMovieId || !commentListEl) return;
      commentListEl.innerHTML = '<div class="empty-comments">Memuat komentar...</div>';
      try {
        const res = await fetch(`${URL_APPS_SCRIPT}?tmdbId=${currentMovieId}`);
        const hasil = await res.json();
        if (hasil.status !== "success" || !hasil.data?.length) {
          commentListEl.innerHTML = '<div class="empty-comments">Belum ada komentar. Jadilah yang pertama!</div>';
          return;
        }
        commentListEl.innerHTML = hasil.data.map(item => `
          <div class="comment-item">
            <div class="comment-name">${item.nama || 'Anonim'}</div>
            <div class="comment-text">${item.komentar || ''}</div>
            <div class="comment-date">${new Date(item.timestamp).toLocaleString('id-ID')}</div>
          </div>
        `).join('');
      } catch {
        commentListEl.innerHTML = '<div class="empty-comments">Gagal memuat komentar.</div>';
      }
    }

    // ✅ Jalankan Semua Saat Halaman Siap
    window.addEventListener('DOMContentLoaded', async () => {
      lucide.createIcons();
      currentMovieId = ambilIdDariUrl();
      if (!currentMovieId) {
        if (videoWrapper) {
          videoWrapper.innerHTML += `<div style="padding:50px; text-align:center; color:#fff; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">ID Film tidak ditemukan</div>`;
        }
        return;
      }
      await cekDanMuatFilm(currentMovieId);
    });
  </script>
  <script>
    // ============== FUNGSI BERSIHKAN LINK & PELINDUNG ==============
    function bersihkanLink(link) {
      if (!link) return '';
      return link.trim();
    }

    // ============== FUNGSI BERSIHKAN TEKS ==============
    function escapeHtml(teks) {
      const div = document.createElement('div');
      div.textContent = teks;
      return div.innerHTML;
    }

    // ============== PELINDUNG KLIK KANAN ==============
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'u' || e.key === 's' || e.key === 'p')) {
        e.preventDefault();
      }
    });

    // ============== INISIALISASI IKON LUCIDE ==============
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });
  </script>
