<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Grid Film</title>
</head>
<body>
  <h1>Daftar Film</h1>
  <div id="movies"></div>

  <script>
    async function loadMovies(page = 1) {
      const formData = new FormData();
      formData.append('action', 'doo_load_movies');
      formData.append('page', page);

      const response = await fetch('https://ssstik.tv/wp-admin/admin-ajax.php', {
        method: 'POST',
        body: formData,
        credentials: 'include' // penting kalau butuh cookie/session
      });

      const text = await response.text();

      try {
        // Jika response berupa JSON
        const data = JSON.parse(text);
        document.getElementById('movies').innerHTML = data.html || text;
      } catch (e) {
        // Jika response langsung HTML
        document.getElementById('movies').innerHTML = text;
      }
    }

    loadMovies(1);
  </script>
</body>
</html>
