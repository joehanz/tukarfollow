<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Grid Film Sederhana</title>
  <style>
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .movie {
      width: 200px;
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    .movie img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Daftar Film</h1>
  <div id="movies" class="grid"></div>

  <script>
    async function loadMovies(page = 1) {
      const formData = new FormData();
      formData.append('action', 'doo_load_movies');
      formData.append('page', page);

      const response = await fetch('https://ssstik.tv/wp-admin/admin-ajax.php', {
        method: 'POST',
        body: formData
      });

      const html = await response.text();
      document.getElementById('movies').innerHTML = html;
    }

    // Panggil halaman pertama
    loadMovies(1);
  </script>
</body>
</html>
