  <script>
// ==============================================
// ✅ ALTERNATE.HTML — Pakai Apps Script sebagai Jembatan
// Cocokkan TMDB ID → dapatkan KODE ABYSS → buka pemutar
// ==============================================
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzoTAiVa0gMhNB-BJs3fLb4y9gKe-MzRWorDOF0y3TgvaRb2lWtj3docQ0abSCIEMBi/exec';
const ABYSS_PLAYER_BASE = 'https://api.abyss.to/player/';

// 🎯 Elemen
const filmIframe = document.getElementById('filmIframe');
const videoWrapper = document.getElementById('videoWrapper');
const btnHomeBack = document.getElementById('btnHomeBack');
const btnAddComment = document.getElementById('btnAddComment');
const btnViewComments = document.getElementById('btnViewComments');
const btnFullscreen = document.getElementById('btnFullscreen');
const commentsPanel = document.getElementById('commentsPanel');
const closeCommentsBtn = document.getElementById('closeCommentsBtn');
const commentListEl = document.getElementById('commentList');
const infoPanel = document.getElementById('infoPanel');
const panelBackdrop = document.getElementById('panelBackdrop');

let currentMovieId = null;
let currentMovieTitle = '';

// ✅ Ambil ID & Judul dari URL ?id=12345/judul
function ambilDariUrl() {
  const q = window.location.search;
  if (!q) return { id: null, judul: '' };
  const bersih = q.replace(/^\?id=/, '');
  const bagian = bersih.split('/');
  return {
    id: bagian[0].replace(/\D/g, '') || null,
    judul: bagian[1] || ''
  };
}

// ✅ Cocokkan lewat Apps Script → dapatkan KODE ABYSS
async function dapatkanKodeAbyss(tmdbId, judulDariUrl = '') {
  if (!tmdbId) return null;

  try {
    console.log('🔍 Cari kode Abyss untuk TMDB ID:', tmdbId);

    // Minta Apps Script yang BACA langsung ke Abyss
    const res = await fetch(`${URL_APPS_SCRIPT}?action=cariAbyss&tmdbId=${tmdbId}&judul=${encodeURIComponent(judulDariUrl)}`, {
      cache: "no-store"
    });

    const hasil = await res.json();
    console.log('📦 Hasil dari Apps Script:', hasil);

    if (hasil.status === 'success' && hasil.kodeAbyss) {
      return hasil.kodeAbyss; // ← Contoh: "JhGHsElQU"
    }

    // Fallback: buka halaman pencarian Abyss kalau tidak ketemu
    return null;

  } catch (err) {
    console.warn('⚠️ Gagal hubung Apps Script:', err);
    return null;
  }
}

// ✅ Pasang Pemutar
async function pasangPemutar() {
  const { id, judul } = ambilDariUrl();
  currentMovieId = id;
  currentMovieTitle = judul;

  if (!currentMovieId) {
    videoWrapper.innerHTML = `
      <div class="status-info error">
        <h3>ID Film tidak ditemukan</h3>
        <button class="submit-btn" style="margin-top:20px;" onclick="window.location.href='index.html'">Kembali ke Beranda</button>
      </div>
    `;
    return;
  }

  // Tampilkan status memuat
  videoWrapper.innerHTML = `
    <div style="display:flex; align-items:center; justify-content:center; height:100%; color:#fff;">
      <div>
        <p>🔎 Mencari di Abyss...</p>
      </div>
    </div>
  `;

  const kodeAbyss = await dapatkanKodeAbyss(currentMovieId, currentMovieTitle);

  if (kodeAbyss) {
    // ✅ DAPAT KODE → BUKA PEMUTAR
    console.log('✅ Kode Abyss:', kodeAbyss);
    filmIframe.src = `${ABYSS_PLAYER_BASE}${kodeAbyss}`;
  } else {
    // ❌ Tidak ketemu → tampilkan info manual
    videoWrapper.innerHTML = `
      <div class="status-info error">
        <h3>Film belum terdaftar di Abyss</h3>
        <p>TMDB ID: ${currentMovieId}</p>
        <p style="font-size:14px; color:#aaa; margin:10px 0;">Unggah file film di dashboard Abyss lalu cocokkan namanya</p>
        <button class="submit-btn" style="margin-top:10px;" onclick="window.history.back()">Kembali</button>
      </div>
    `;
  }
}

// ✅ Layar Penuh
btnFullscreen?.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.();
    screen.orientation?.lock('landscape').catch(() => {});
  } else {
    document.exitFullscreen?.();
    screen.orientation?.unlock?.();
  }
  lucide.createIcons();
});
document.addEventListener('fullscreenchange', () => {
  if (!btnFullscreen) return;
  btnFullscreen.innerHTML = document.fullscreenElement
    ? '<i data-lucide="minimize"></i>'
    : '<i data-lucide="maximize"></i>';
  lucide.createIcons();
});

// ✅ Kembali ke watch.html
btnHomeBack?.addEventListener('click', () => {
  if (window.history.length > 1) window.history.back();
  else window.location.href = 'index.html';
});

// ✅ Komentar
btnAddComment?.addEventListener('click', () => {
  infoPanel?.classList.add('show');
  panelBackdrop?.classList.add('active');
});
panelBackdrop?.addEventListener('click', () => {
  infoPanel?.classList.remove('show');
  panelBackdrop?.classList.remove('active');
});

async function kirimKomentar() {
  const nama = document.getElementById('commentName')?.value.trim();
  const teks = document.getElementById('commentText')?.value.trim();
  if (!nama || !teks) return alert("Isi nama dan komentar dulu!");
  try {
    await fetch(URL_APPS_SCRIPT, {
      method: 'POST',
      mode: 'no-cors',
      body: JSON.stringify({ tmdbId: currentMovieId, nama, komentar: teks })
    });
    alert("✅ Komentar terkirim!");
    infoPanel?.classList.remove('show');
    panelBackdrop?.classList.remove('active');
    setTimeout(muatKomentar, 800);
  } catch {
    alert("❌ Gagal kirim. Coba lagi.");
  }
}

btnViewComments?.addEventListener('click', () => {
  const buka = commentsPanel?.classList.toggle('open');
  if (buka) muatKomentar();
});

closeCommentsBtn?.addEventListener('click', () => {
  commentsPanel?.classList.remove('open');
});

async function muatKomentar() {
  if (!currentMovieId || !commentListEl) return;
  commentListEl.innerHTML = '<div class="empty-comments">Memuat...</div>';
  try {
    const res = await fetch(`${URL_APPS_SCRIPT}?tmdbId=${currentMovieId}`);
    const hasil = await res.json();
    if (hasil.status !== "success" || !hasil.data?.length) {
      commentListEl.innerHTML = '<div class="empty-comments">Belum ada komentar. Jadilah yang pertama!</div>';
      return;
    }
    commentListEl.innerHTML = hasil.data.map(item => `
      <div class="comment-item">
        <div class="comment-name">${item.nama || 'Anonim'}</div>
        <div class="comment-text">${item.komentar || ''}</div>
        <div class="comment-date">${new Date(item.timestamp).toLocaleString('id-ID')}</div>
      </div>
    `).join('');
  } catch {
    commentListEl.innerHTML = '<div class="empty-comments">Gagal memuat komentar.</div>';
  }
}

// ✅ Kontrol Subtitle
const subtitleLayer = document.getElementById('subLayer');
const controls = subtitleLayer?.querySelector('.subtitle-controls');
let hideTimer = null;
const HIDE_DELAY = 3000;

function showControls() {
  if (!controls) return;
  controls.style.opacity = '1';
  controls.style.pointerEvents = 'auto';
  controls.style.visibility = 'visible';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    controls.style.opacity = '0';
    controls.style.pointerEvents = 'none';
    controls.style.visibility = 'hidden';
  }, HIDE_DELAY);
}

['touchstart','touchmove','mousedown','mousemove','click','scroll','keydown'].forEach(ev => {
  document.addEventListener(ev, showControls, { passive: true });
});
controls?.addEventListener('click', showControls);

// ✅ JALANKAN
window.addEventListener('DOMContentLoaded', pasangPemutar);
</script>
