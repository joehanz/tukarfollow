<script>
// ==============================================
// ⚙️ KONFIGURASI
// ==============================================
const API_KEY = 'c000d7b8b0f5ee16b98b6103009745d8';
const BASE_URL = 'https://api.themoviedb.org/3';
const URL_APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbzoTAiVa0gMhNB-BJs3fLb4y9gKe-MzRWorDOF0y3TgvaRb2lWtj3docQ0abSCIEMBi/exec';
// ✅ SEMUA 5 FILE JSON
const JSON_PATHS = [
  'https://midasxxi.github.io/tukarfollow/movies.json',
  'https://midasxxi.github.io/tukarfollow/movies2025.json',
  'https://midasxxi.github.io/tukarfollow/movies2024.json',
  'https://midasxxi.github.io/tukarfollow/moviesclassic.json',
  'https://midasxxi.github.io/tukarfollow/playcinematic.json'
];
const JSON_PATH_PLAYCINEMATIC = 'https://midasxxi.github.io/tukarfollow/playcinematic.json';
const SUMBER_EMBED = {
  utama: (id) => `https://vsembed.ru/embed/movie?tmdb=${id}`,
  cadangan1: (id) => `https://vsembed.su/embed/movie?tmdb=${id}`
};

// 🎯 ELEMEN
const filmIframe = document.getElementById('filmIframe');
const btnHomeBack = document.getElementById('btnHomeBack');
const btnAddComment = document.getElementById('btnAddComment');
const btnViewComments = document.getElementById('btnViewComments');
const btnSubIndo = document.getElementById('btnSubIndo');
const btnSubIndo2 = document.getElementById('btnSubIndo2');
const btnFullscreen = document.getElementById('btnFullscreen');
const commentsPanel = document.getElementById('commentsPanel');
const closeCommentsBtn = document.getElementById('closeCommentsBtn');
const commentListEl = document.getElementById('commentList');
const infoPanel = document.getElementById('infoPanel');
const panelBackdrop = document.getElementById('panelBackdrop');
let currentMovieId = null;

// ==============================================
// 🔧 FUNGSI BANTU
// ==============================================
function ambilIdDariUrl() {
  const q = window.location.search;
  if (!q) return null;
  const idBersih = q.replace('?id=', '').split('/')[0].replace(/\D/g, '');
  return idBersih || null;
}

// ✅ Baca data sumber dari script.js (dikirim lewat sessionStorage)
function bacaDataSumber() {
  try {
    const raw = sessionStorage.getItem('sumberFilm');
    if (raw) return JSON.parse(raw);
  } catch (e) {
    console.warn('⚠️ Tidak ada data sumber dari halaman utama');
  }
  return null;
}

// ✅ Fallback: cek langsung ke file JSON kalau data belum sampai
async function cekSumberLangsung(tmdbId) {
  const hasil = { utama: false, playcinematic: false };
  try {
    for (let i = 0; i < JSON_PATHS.length; i++) {
      const res = await fetch(JSON_PATHS[i], { cache: "no-store" });
      if (res.ok) {
        const daftar = await res.json();
        const ketemu = daftar.some(f => Number(f.tmdb_id) === Number(tmdbId));
        if (ketemu) {
          if (i === 4) hasil.playcinematic = true;
          else hasil.utama = true;
        }
      }
    }
  } catch (e) {
    console.warn('⚠️ Gagal cek sumber:', e);
  }
  return hasil;
}

function pasangIframeUtama(tmdbId) {
  filmIframe.src = SUMBER_EMBED.utama(tmdbId);
  filmIframe.onerror = () => { filmIframe.src = SUMBER_EMBED.cadangan1(tmdbId); };
}

async function cariJudulDariSemuaJson(tmdbId) {
  for (const file of JSON_PATHS) {
    try {
      const res = await fetch(file, { cache: "no-store" });
      if (res.ok) {
        const daftar = await res.json();
        const ketemu = daftar.find(f => Number(f.tmdb_id) === Number(tmdbId));
        if (ketemu?.title) {
          return ketemu.title.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').substring(0, 50);
        }
      }
    } catch (err) { console.warn('⚠️', err); }
  }
  return 'unknown';
}

// 🎮 TOMBOL-TOMBOL
// ==============================================

btnHomeBack?.addEventListener('click', () => {

});

// Buka alternate.html
btnSubIndo?.addEventListener('click', async () => {
  if (!currentMovieId) return alert("ID film tidak ditemukan.");
  const judulUrl = await cariJudulDariSemuaJson(currentMovieId);
  window.location.href = `alternate.html?id=${currentMovieId}/${judulUrl}`;
});

// Buka alternate2.html

});

// Komentar
btnAddComment?.addEventListener('click', () => { infoPanel?.classList.add('show'); panelBackdrop?.classList.add('active'); });
panelBackdrop?.addEventListener('click', () => { infoPanel?.classList.remove('show'); panelBackdrop?.classList.remove('active'); });
btnViewComments?.addEventListener('click', () => { const buka = commentsPanel?.classList.toggle('open'); if (buka) muatKomentar(); });
closeCommentsBtn?.addEventListener('click', () => { commentsPanel?.classList.remove('open'); });

async function kirimKomentar() {
  const nama = document.getElementById('commentName')?.value.trim();
  const teks = document.getElementById('commentText')?.value.trim();
  if (!nama || !teks) return alert("Isi nama dan komentar dulu!");
  await fetch(URL_APPS_SCRIPT, {
    method: 'POST', mode: 'no-cors',
    body: JSON.stringify({ tmdbId: currentMovieId, nama, komentar: teks })
  });
  alert("✅ Komentar terkirim!");
  infoPanel?.classList.remove('show'); panelBackdrop?.classList.remove('active');
  setTimeout(muatKomentar, 800);
}

async function muatKomentar() {
  if (!currentMovieId || !commentListEl) return;
  commentListEl.innerHTML = '<div class="empty-comments">Memuat komentar...</div>';
  try {
    const res = await fetch(`${URL_APPS_SCRIPT}?tmdbId=${currentMovieId}`);
    const hasil = await res.json();
    if (hasil.status !== "success" || !hasil.data?.length) {
      commentListEl.innerHTML = '<div class="empty-comments">Belum ada komentar. Jadilah yang pertama!</div>';
      return;
    }
    commentListEl.innerHTML = hasil.data.map(item => `
      <div class="comment-item">
        <div class="comment-name">${item.nama || 'Anonim'}</div>
        <div class="comment-text">${item.komentar || ''}</div>
        <div class="comment-date">${new Date(item.timestamp).toLocaleString('id-ID')}</div>
      </div>`).join('');
  } catch {
    commentListEl.innerHTML = '<div class="empty-comments">Gagal memuat komentar.</div>';
  }
}

<script>
// Kontrol tampil/sembunyi tombol kendali
const subtitleLayer = document.getElementById('subLayer');
const controls = subtitleLayer?.querySelector('.subtitle-controls');
let hideTimer = null;
const HIDE_DELAY = 3000;
function showControls() {
  if (!controls) return;
  controls.style.opacity = '1';
  controls.style.pointerEvents = 'auto';
  controls.style.visibility = 'visible';
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    controls.style.opacity = '0';
    controls.style.pointerEvents = 'none';
    controls.style.visibility = 'hidden';
  }, HIDE_DELAY);
}
['touchstart','touchmove','mousedown','mousemove','click','scroll','keydown'].forEach(ev => {
  document.addEventListener(ev, showControls, { passive:true });
});
document.addEventListener('DOMContentLoaded', showControls);
</script>

<script>
// Anti-kiri & pelindung
(function(){
  const REDIRECT = "/akses-ditolak.html";
  function peringatan(pesan){
    const d = Object.assign(document.createElement('div'), {
      style: 'position:fixed;inset:0;background:rgba(0,0,0,.92);color:#fff;z-index:999999;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;',
      innerHTML: pesan || '⚠️ Akses dibatasi'
    });
    document.body.appendChild(d);
    setTimeout(() => { location.href = REDIRECT; }, 2500);
  }
  document.addEventListener('contextmenu', e => { e.preventDefault(); peringatan('🚫 Klik kanan dinonaktifkan'); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey && [65,67,83,85,88,80].includes(e.keyCode)) ||
        (e.ctrlKey && e.shiftKey && [73,74,67].includes(e.keyCode)) || e.keyCode === 123) {
      e.preventDefault(); peringatan('🚫 Akses tidak diizinkan');
    }
  });
  const css = document.createElement('style');
  css.textContent = 'body{-webkit-user-select:none;-moz-user-select:none;user-select:none;}img{pointer-events:none;}';
  document.head.appendChild(css);
})();
</script>
